name: Architecture CI

on:
  push:
    branches:
      - architecture/multi-place-implementation-v01
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts-and-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python contract checks
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for f in tests/check_*.py; do
            echo "::group::$f"
            if ! python3 "$f"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Setup Rokit
        if: always()
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Rojo builds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rojo --version
          rojo build default.project.json -o /tmp/LunaWorld-default.rbxlx
          rojo build test.project.json -o /tmp/LunaWorld-tests.rbxlx
          rojo build world.project.json -o /tmp/LunaWorld-world.rbxlx

      - name: Diff whitespace check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
